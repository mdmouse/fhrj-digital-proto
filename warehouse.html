    const pid=val(prefix+'Pid'+i),qty=+val(prefix+'Qty'+i),price=+val(prefix+'Price'+i);

  const box=document.getElementById(prefix+'Lines'),total=document.getElementById(prefix+'Total');
  if(!box||!total) return;
  let s=0;
  box.querySelectorAll('[data-line-row]').forEach(row=>{const i=row.getAttribute('data-line-row');s+=(+val(prefix+'Qty'+i)||0)*(+val(prefix+'Price'+i)||0)});
  total.textContent=money(s);
}
function bindLineEditors(prefix){
  const box=document.getElementById(prefix+'Lines');if(!box)return;
  if(!box.dataset.bound){
    box.dataset.bound='1';
    box.addEventListener('input',()=>recalcLines(prefix));
    box.addEventListener('change',e=>{
      if(!e.target||!String(e.target.id||'').startsWith(prefix+'Pid'))return;
      const i=e.target.closest('[data-line-row]')?.getAttribute('data-line-row');
      const price=document.getElementById(prefix+'Price'+i);
      if(price) price.value=product(e.target.value).price;
      recalcLines(prefix);
    });
  }
  recalcLines(prefix);
}
function product(id){

  if(f){
    const lines=f.lines.filter(l=>MATERIALS.some(m=>m.id===l.mid)).map(l=>[l.mid,l.qty]);
    if(lines.length){p.bom=lines;p.formulaId=f.id;p.formulaVer=f.version}
  }

}

function ensureOfficialFormulas(){
  const have=new Set((state.formulas||[]).map(f=>f.id));

  ['P05','P06','P07','P08','P09','P10','P11','P12','P14'].forEach(pid=>{
    const active=(state.formulas||[]).find(f=>f.pid===pid&&f.status==='已批准'&&f.active);

    const src=(state.formulas||[]).find(f=>f.pid===pid&&f.status==='已批准')||seedFormulas().find(f=>f.pid===pid&&f.active);
    if(!src) return;
    (state.formulas||[]).filter(f=>f.pid===pid).forEach(f=>f.active=false);
    if(!(state.formulas||[]).some(f=>f.id===src.id)) state.formulas.unshift(Object.assign({},src,{active:true}));

function lineNeed(pid,qty){
  if(isKit(pid)) return [];
  return product(pid).bom.map(([mid,n])=>{const m=state.materials.find(x=>x.id===mid);if(!m)return null;const need=Math.ceil(n*qty*1000)/1000,available=availableOf(m);return {m,need,available,short:Math.max(0,Math.round((need-available)*1000)/1000),pid}}).filter(Boolean);
}
function mergeNeeds(list){
  const map=new Map();
  list.forEach(r=>{const cur=map.get(r.m.id);if(!cur)map.set(r.m.id,Object.assign({},r));else{cur.need=Math.round((cur.need+r.need)*1000)/1000;cur.short=Math.max(0,Math.round((cur.need-cur.available)*1000)/1000)}});
  return [...map.values()];
}

function allocation(o){
  const out=[];let left=0;
  orderLines(o).forEach(l=>{
    let remain=l.qty;
    const good=state.batches.filter(b=>b.pid===l.pid&&b.status==='合格'&&b.qty>0&&Date.parse(b.exp)>Date.parse(o.due)&&getFresh(b,o.due)>=o.fresh).sort((a,b)=>a.exp.localeCompare(b.exp));
    good.forEach(b=>{
      const used=out.filter(x=>x.b.id===b.id).reduce((s,x)=>s+x.qty,0);
      const qty=Math.min(remain,b.qty-used);
      remain-=qty;
      if(qty) out.push({b,qty,pid:l.pid});
    });
    left+=remain;
  });
  return {lines:out,left};
}

function formulaTable(f){

  if(f.kit) return table(['内装 / 包材','单盒数量','追溯规则'],(f.lines||[]).map(l=>[l.name||l.mid,num(l.qty)+' '+(l.unit||''),l.role==='内装'?'绑定对应成品批次与效期':'绑定包装批次与审定版本']));
  if(!(f.lines||[]).length) return notice('物料清单为空，不能提交评审。请从参考产品带入，或手工维护物料行。','warn')+`<div class="mt">${btn('从参考产品带入物料','fill-formula',f.id,'primary small')}${btn('手工维护物料','edit-formula-lines',f.id,'small')}</div>`;
  return table(['物料 / 角色','每箱标准消耗','工艺损耗','标准材料成本'],f.lines.map(l=>{const m=materialOf(l.mid);return[`${m.name}<small>${l.role||'物料'} · ${m.batch||'—'}</small>`,num(l.qty)+' '+(m.unit||''),l.loss?l.loss+'%':'—',money((m.price||0)*l.qty)]}))+`<div class="bom-cost"><span>标准材料成本 / 箱</span><strong>${money(formulaCost(f))}</strong></div>`;
}

    +`<div class="grid cols4 mb">${stat('待同步',state.jobs.filter(j=>j.status==='待同步').length+'<small>条</small>','业务操作自动入队','link')}${stat('已回执',state.jobs.filter(j=>j.status==='成功').length+'<small>条</small>','保留单据与回执','check')}${stat('失败需处理',state.jobs.filter(j=>j.status==='失败').length+'<small>条</small>','先补映射再重试','clock')}${stat('映射待补',(state.maps||[]).filter(m=>m.status!=='已映射').length+'<small>条</small>','未映射不能过账','shield')}</div>`
    +card('接口任务',table(['任务 / 类型','业务单号','状态','说明','重试','操作'],state.jobs.map(j=>[`${j.id}<small>${j.type}</small>`,j.doc,tag(j.status),j.status==='成功'?`<span class="micro">${j.receipt}</span>`:j.reason,j.attempt,j.status==='失败'?action('修复并重试','retry-job',j.id):action('查看日志','job-detail',j.id)])),'同一业务键只产生一份回执')
    +`<div class="mt">${card('对账单',`<div class="card-body">${kv([['业务事件',state.jobs.length+' 条'],['已回执',state.jobs.filter(j=>j.status==='成功').length+' 条'],['未闭环',state.jobs.filter(j=>j.status!=='成功').length+' 条']])}<div class="mt">${btn('生成对账报告','reconcile','','small primary')}</div></div>`)}</div>`;
}
function integrationMapPanel(){
  return card('编码映射',table(['映射单','对象','本平台','用友编码','状态','操作'],(state.maps||[]).map(m=>[m.id,m.obj,m.local,m.erp||'—',tag(m.status),action('打开','map-detail',m.id)])),'客户 CUS-2602 未勾选确认前，失败任务不能重试')
    +`<div class="mt">${btn('补齐家家悦映射','mapping','','primary small')}</div>`;
}
function integrationEnvPanel(){
  return card('对接环境单',table(['单号','事项','负责人','日期','状态','操作'],(state.envs||[]).map(e=>[e.id,esc(e.title),esc(e.owner),e.date,tag(e.status),action('打开','env-detail',e.id)])),'未确认账套和许可前，不连生产环境');
}

function scopeContent(){return `<div class="quote">建议定位：以简道云或经确认的业务平台承接管理流程与食品行业业务扩展，协同用友财务/供应链能力；以“订单、物料、批次、人员、设备、项目”作为共同对象。优先完成第一条可追溯业务闭环，再扩展渠道与精细成本。</div><div class="grid cols3 mt">${[['投产有准备','工程、设备、许可、工艺、人员、数据与系统同时准备；投产须经过门禁评审。'],['过程可追溯','从原料、包材到成品、礼盒与客户；记录随流程产生，异常当场进入处理。'],['经营能协同','销售看交期、生产看任务、质量看风险、仓库看状态、财务看确认单据。']].map(([h,p])=>card(h,`<div class="card-body"><p class="smalltext muted">${p}</p></div>`)).join('')}</div><div class="card mt">${MODULES.map((m,i)=>`<details class="accordion" ${i===0?'open':''}><summary>${String(i+1).padStart(2,'0')}　${m[0]}　${tag(m[5],'neutral')}</summary><div class="accordion-body"><p><b>目标：</b>${m[1]}</p>${kv([['功能范围',m[2]],['关键数据与规则',m[3]],['业务价值',m[4]]])}<div class="mt">${jumpBtn('打开模块',m[6],'small')}</div></div></details>`).join('')}</div>`}
function roadmapContent(){return `<div class="notice mb">排期为工作量规划建议，基于关键人员及时参与、主数据可整理、用友测试环境及接口授权可用；与实际工厂建设计划联动。具体排期按现场准备情况确认。</div><div class="grid cols4">${[['00','蓝图与基础','约 2–3 周','主体、产品、工艺与用友边界调研；选择试点 SKU 和一条完整流程；编码、权限、接口契约和验收基线。','蓝图签字、数据字典、原型确认和接口可行性证明'],['01','投产最小闭环','约 6–10 周','客户订单、采购、批次库存、BOM、工单、检验放行、追溯、人员资质、工厂任务与用友基础对接。','完成采购到销售追溯演练；质量拦截、库存与财务对账通过'],['02','运营深化','约 4–8 周','渠道价格与返利、客户服务、委外、设备维护、费用人力、计件、成本与管理分析。','业务负责人连续运行确认，差异可解释、异常能关闭'],['03','采集与优化','按专项评估','PDA、电子秤、标签打印、温湿度、设备联网；高级排程、门户和辅助分析按收益逐项立项。','设备/接口稳定性、数据质量、业务改善效果专项验收']].map(([n,h,d,s,g])=>`<div class="card phase"><div class="phase-no">PHASE ${n}</div><h3>${h}</h3><p>${s}</p><span class="duration">${d}</span><div class="mt"><h4>阶段出口</h4><p>${g}</p></div></div>`).join('')}</div><div class="grid cols2 mt">${card('上线策略',`<div class="card-body"><div class="timeline"><div><h3>选一条高价值试点链</h3><p>一个产品族、一条产线、一个仓库与一个渠道；覆盖完整批次闭环，避免同时上线所有边缘场景。</p></div><div><h3>准备主数据与期初</h3><p>SKU、BOM、单位、库位、客户、供应商、人员和权限；期初库存按批次、数量与状态盘点签字。</p></div><div><h3>并行与切换</h3><p>设定切换日、单据归属与回退条件；避免两边重复维护。并行对账后再关闭旧流程。</p></div><div><h3>陪跑与持续改进</h3><p>按岗位培训、现场演练、日报与问题清单；每日跟踪堵点，按版本交付改进。</p></div></div></div>`)}${card('项目角色与投入',table(['责任方','必要职责'],[['经营负责人','拍板范围、数据归属、跨部门规则与阶段验收'],['业务骨干','销售/采购/生产/质量/仓库/人力/财务各指定负责人'],['客户 IT / 用友服务商','环境、接口许可、测试账套、网络与单据验证'],['实施团队','蓝图、配置、扩展、集成、数据迁移、培训与陪跑'],['质量负责人','工艺与检验规则、追溯演练及食安业务验收']]))}</div><div class="notice mt">费用需拆分评估：平台账号及版本、实施交付、用友接口许可与服务、扩展开发、硬件与设备接入、数据迁移、培训陪跑、年度运维。费用按账号、实施、接口与硬件分项评估。</div>`}
function acceptanceContent(){return card('按业务结果验收',table(['验收场景','必须观察到的结果','责任人'],[['订单到出库','审批后可备料生产，产出待检，放行后按客户效期规则发货；各单据可回溯','销售 / 生产 / 仓库'],['未放行拦截','待检、隔离、冻结、过期批次不能出库；前端与服务端规则一致','质量 / IT'],['物料与库存','已预留不可再次占用；并发出库不超卖；领退料与盘点差异留单','仓库 / IT'],['一批多向追溯','原料多批混投、拆批、礼盒装配、退货均可正反向追溯；数量守恒','质量 / 生产'],['召回演练','确定影响批次、冻结、找客户、登记通知/回收/处置；未回收量有结论','质量 / 销售'],['用友异常补偿','重复推送不重复建单；超时重试、错码、红冲、反审核与跨期有正确处理','财务 / 用友服务商'],['财务对账','源单行号、数量、单位、税额、金额及状态一致；差异有定位和处理人','财务'],['人员资质','失效健康证明或未完成培训触发相应岗位上岗限制，修复后经授权恢复','人力 / 生产'],['权限与审计','越权查看、导出、审批、放行受阻；敏感信息受控；关键变更日志可核查','IT / 业务负责人'],['投产门禁','适用许可、设备、工艺、质量、人员、数据和应急方案全部由责任人确认','项目负责人'],['恢复与连续性','在约定恢复目标内完成备份恢复演练；网络故障有明确处置方案','IT / 运维']],'matrix'),'每个场景须用真实样本和业务数据验证，而不是只看页面能否打开')+`<div class="mt">${card('价值评估先建立基线',table(['业务指标','统一口径','改善方式'],[['交付及时率','按约定日期完成签收的订单 / 到期订单；明确分批规则','跟踪插单、缺料、未检与产能冲突'],['批次追溯耗时','从给定批号到完整关联范围和数量核对完成的时间','定期演练，以实际耗时比较'],['临期与报损','按财务确认成本计量的临期库存与报损金额','分层预警、渠道协调和备货改善'],['质量与良率','同产品同工艺的合格重量 / 实际投入重量或批准口径','先明确水分、加工损耗和返工处理'],['库存准确率','盘点账实相符条目与数量差异，双口径记录','扫码、单据及时性与盘点闭环'],['财务对账效率','差异单数、处理周期、重复录入次数','主数据一致、回执与自动差异清单']],'matrix'),'目标值在基线采样后共同确定')}</div>`}
function modelContent(){return `<div class="card">${table(['核心对象','关键字段与关联','设计要求'],[['组织 / 法人 / 账套','公司、工厂、部门、成本中心、用友账套','法人与账套按实际主体分别建档，不混账'],['产品 / 物料','SKU、类别、规格、单位、换算、过敏原、储存条件、期限','主编码唯一，关键属性变更受控'],['配方 / 工艺 / 包装','版本、生效、批准、物料清单、工序、参数规则','工单引用已冻结版本；商业秘密分级访问'],['订单 / 行项目','客户、产品、量价、交期、效期要求、合同与版本','行级关联发货、退货、应收与回款'],['生产单 / 投料 / 产出','订单、产品、原料批、包材批、产出批、量、人员、设备','支持拆分合并与分次报工，保持数量关系'],['批次 / 库存流水','批次、库位、数量、质量状态、生产日、到期日、来源','批次状态与库存数量独立；库存变动以单据记录'],['质量单 / 放行 / CAPA','检验结果、报告、标准版本、处置、批准与整改','放行授权单独控制；修改形成新版本'],['召回 / 追溯关系','影响批次、客户、冻结量、回收量、处置量、通知结果','适用范围和数量可解释；关闭须复核'],['人员 / 岗位 / 班次','组织、职责、证件有效期、培训、授权与工时','必要信息最小化；薪资与健康附件严格授权'],['项目 / 设备 / 资产','合同、里程碑、预算、验收、设备编号、保养与转固','工程阶段资料向运营无缝移交'],['集成任务 / 映射 / 回执','业务键、版本、用友ID、状态、重试、时间与错误码','业务事务可靠入队；幂等、对账和人工补偿']],'matrix')}</div><div class="grid cols2 mt">${card('系统架构建议',`<div class="card-body"><div class="flow"><div class="flow-step"><b>PC / 移动端</b><small>按岗位作业</small></div><span class="flow-arrow">→</span><div class="flow-step current"><b>业务应用层</b><small>表单 / 流程 / 批次管理</small></div></div><div class="flow mt"><div class="flow-step"><b>集成服务</b><small>队列 / 映射 / 重试 / 对账</small></div><span class="flow-arrow">↔</span><div class="flow-step"><b>用友系统</b><small>财务与约定供应链范围</small></div></div><div class="notice mt">设备网关、条码、称量和外部渠道按需接入。界面按岗位作业设计，实施时按平台能力落地。</div></div>`)}${card('生产化建设必须补齐',`<div class="card-body"><ul class="bullets"><li>真实身份认证、服务端数据权限、流程授权与审批职责分离。</li><li>事务库存、并发锁与唯一业务键，防止超领和重复出库。</li><li>附件管理、审计、备份恢复、监控告警和留存策略。</li><li>平台许可与性能压测，终端网络和设备协议的现场验证。</li><li>真实工艺、检验标准和会计口径的专业确认。</li></ul></div>`)}</div>`}
PAGES.blueprint=()=>title('数字化建设方案','围绕工厂投产和日常经营，建立一套能上线、能使用、能持续改进的方案。',btn(ico('download')+' 打印完整方案','print-plan')+btn('操作指南','help','','primary'))+tabsHtml([['scope','总体方案与模块'],['roadmap','实施路线与责任'],['acceptance','验收与价值指标'],['model','数据与系统架构'],['questions','实施确认清单']])+({'scope':scopeContent,'roadmap':roadmapContent,'acceptance':acceptanceContent,'model':modelContent,'questions':()=>card('实施前确认事项',table(['主题','必须问清的问题','建议资料','负责人'],QUESTIONS,'matrix'),'这些问题决定功能取舍、工期与对接成本；可作为实施前确认提纲')}[tabs.blueprint||'scope']());
function researchContent(){return `<div class="notice mb"><b>河北凤凰人家食品有限公司</b>　迁西工厂数字化运营。袋装板栗、酥糖麻糖与节庆礼盒量产，产供销、质量追溯与用友财务同一套数据。</div><div class="grid cols3 mb">${card('企业主体',`<div class="card-body"><ul class="bullets"><li>河北凤凰人家食品有限公司。</li><li>唐山迁西板栗及传统糖食制造。</li><li>覆盖生产、销售、质量、仓储与人力。</li><li>财务与库存协同用友账套。</li></ul></div>`,'迁西工厂')}${card('产品线',`<div class="card-body"><ul class="bullets"><li>袋装板栗、散称板栗。</li><li>720酥糖、桃酥铁盒、蜂蜜麻糖。</li><li>童趣 / 丰收 / 传承 / 两小无猜礼盒。</li><li>皮影戏、吉祥、四季、印象唐山礼盒。</li></ul></div>`,'量产 SKU')}${card('经营渠道',`<div class="card-body"><ul class="bullets"><li>区域经销：迁西栗香商贸。</li><li>商超：唐山家家悦高新店。</li><li>团购：开滦集团工会生活服务中心。</li><li>新渠道：曹妃甸港区职工生活超市。</li></ul></div>`,'在营客户')}</div>${card('监管与对接依据',table(['编号 / 来源','用途','说明'],SOURCES.map(([id,t,u,c,l])=>[`${id}<br><a class="source-link" href="${u}" target="_blank" rel="noopener">${t} ↗</a>`,c,l]),'matrix'),'食安台账按日管控、周排查、月调度落地')}<div class="grid cols2 mt">${card('业务重点',`<div class="card-body">${kv([['保质期管理','批次、库位、库存周转和客户收货效期统一校验'],['配方与包装','配方、包材、标签版本受控，工单只引用生效版本'],['原料产季','板栗原料按批次、水分和产地报告入厂'],['节庆备货','经销、商超、团购按交期联合排产'],['工厂运行','设备、人员资质、食安资料与系统同步运转']])}</div>`)}${card('系统覆盖',`<div class="card-body"><ul class="bullets"><li>订单、计划、生产、检验放行、仓储发货。</li><li>客户商机、报价、信用、客诉与退换货。</li><li>设备能源、班组授权、协同审批。</li><li>标准成本、往来对账、用友同步与编码映射。</li></ul><div class="mt">${jumpBtn('查看建设方案','blueprint','small')}</div></div>`)}</div>`}

function help(){modal('操作指南 · 从一笔订单讲起',`<div class="notice">建议先走通一笔订单交付，再看一批原料的追溯与召回。可用 Chrome 或 Edge 打开。</div><h3 class="mt">主线一：一笔订单如何交付</h3><div class="timeline mt"><div><h3>1. 销售订单 → SO-260917-001 → 审核</h3><p>规格、箱规、交期和剩余保质期先约定好。</p></div><div><h3>2. 物料测算 → 确认下达生产</h3><p>齐套检查与物料预留。SO-260917-002 可走包装袋缺料及到货检验。</p></div><div><h3>3. 生产执行 → 开工确认 → 记录完工</h3><p>四项确认后开工，完工数量与不良相加须等于计划；成品进入待检。</p></div><div><h3>4. 质量检验 → 勾选资料完整 → 放行</h3><p>生产负责产出，质量负责放行，待检产品发不出去。</p></div><div><h3>5. 销售订单 → 分配发货</h3><p>系统排除不满足客户收货效期的批次，并按先到期先出分配。</p></div><div><h3>6. 用友集成 → 字段映射 → 同步 → 对账</h3><p>单据来源一致、失败可重试、回执可对照。</p></div></div><h3>主线二：一批问题原料如何定位影响</h3><p class="smalltext muted mt">进入批次追溯 → 启动召回 → 查看在库 60 箱和已售 60 箱 → 登记回收 → 处置结案。通知待办由销售跟进。</p>`,btn('导出账套数据','export-state')+btn('重置账套','reset-dialog','','danger')+btn('打开销售订单','go','orders','primary'),true,'操作指南')}

 close:closeModal,help,menu:()=>document.getElementById('sidebar').classList.toggle('open'),go:id=>{closeModal();if(location.hash==='#'+id){page=id;render()}else location.hash=id},tab:id=>{let [k,v]=id.split(':');tabs[k]=v;filter='';filterStatus='全部';render()},

'add-line':id=>{const prefix=id||'o';const box=document.getElementById(prefix+'Lines');if(!box)return;const used=new Set([...box.querySelectorAll('select')].map(s=>s.value));const next=sellableProducts().find(x=>!used.has(x.id))||sellableProducts()[0];if(!next)return toast('没有可售产品');const i=String(Date.now()).slice(-6);box.insertAdjacentHTML('beforeend',lineRowHtml(prefix,i,{pid:next.id,qty:20,price:next.price}));recalcLines(prefix)},
'remove-line':id=>{const [prefix,i]=String(id||'').split(':');const box=document.getElementById(prefix+'Lines');if(!box)return;if(box.querySelectorAll('[data-line-row]').length<=1)return toast('至少保留一行产品');box.querySelector(`[data-line-row="${i}"]`)?.remove();recalcLines(prefix)},

 'save-order':()=>{let customer=val('oCustomer').trim(),fresh=+val('oFresh'),due=val('oDue');const ct=contractOf(val('oContract'));if(ct.id){if(customer&&customer!==ct.customer)return fail('所选合同属于 '+ct.customer+'，与客户不一致');customer=ct.customer}if(!customer)return fail('请填写客户名称');if(!due||due<TODAY)return fail('交期不能早于业务日期 '+TODAY);if(!Number.isFinite(fresh)||fresh<1||fresh>100)return fail('收货剩余保质期须在 1%–100% 之间');const got=collectFormLines('o');if(got.error)return fail(got.error);const id='SO-260917-'+String(state.orders.length+1).padStart(3,'0');const o={id,customer,channel:val('oChannel')||ct.channel||'经销',due,fresh,status:'待审核',owner:val('oOwner').trim()||ct.owner||'销售一组',memo:val('oMemo').trim(),lines:got.lines,contract:ct.id||''};syncOrderHead(o);state.orders.unshift(o);log('创建订单',id);closeModal();page='orders';location.hash='orders';tabs.orders='orders';render();toast(ct.id?'订单已挂到 '+ct.id+'，提交审核':'订单已提交审核，可继续走计划与生产')},
 'order-detail':orderDetail,'approve-order':id=>{const o=state.orders.find(o=>o.id===id);if(!o||o.status!=='待审核')return toast('订单已处理，请勿重复审批');o.status='已审核';markReviewed(o);enqueue('销售订单',id);log('订单审核通过',id);closeModal();render();showMRP(id)},'reject-order':id=>ACTIONS['inbox-reject']('order:'+id),mrp:showMRP,
 'purchase-shortage':id=>{const o=state.orders.find(o=>o.id===id);if(!o)return;const sup=(admittedSuppliers()[0]||{}).id||'';let added=0;requirements(o).filter(r=>r.short>0).forEach(r=>{if(!state.purchaseRequests.some(p=>p.order===id&&p.mid===r.m.id&&p.status!=='已入库'&&p.status!=='已拒收')){state.purchaseRequests.push({id:'PR-'+String(state.purchaseRequests.length+1).padStart(4,'0'),mid:r.m.id,name:r.m.name,qty:r.short,unit:r.m.unit,order:id,supplier:sup,status:'待采购',note:'来自订单缺料测算'});added++}});log('生成缺料采购申请',id);closeModal();tabs.purchase='requests';if(location.hash!=='#purchase')location.hash='purchase';else render();toast(added?'已生成 '+added+' 笔采购申请':'已有采购申请，请跟踪到货检验')},
 'create-work':id=>{const o=state.orders.find(x=>x.id===id);if(!o||o.status!=='已审核')return toast('该订单已处理，请查看关联生产单');if(state.workorders.some(w=>w.order===id))return toast('已有生产单，未重复创建');const lines=orderLines(o);for(const l of lines){const g=formulaGate(l.pid);if(g)return fail(product(l.pid).name+'：'+g)}const req=requirements(o);if(req.some(r=>r.short>0))return showMRP(id);req.forEach(r=>r.m.reserved=(r.m.reserved||0)+r.need);const created=[];lines.forEach(l=>{const lineReq=lineNeed(l.pid,l.qty);const w={id:'MO-'+TODAY.replaceAll('-','').slice(2)+'-'+String(state.workorders.length+1).padStart(3,'0'),order:id,pid:l.pid,qty:l.qty,status:'待开工',kit:isKit(l.pid),version:(product(l.pid).formulaVer||(activeFormula(l.pid)||{}).version||'V1.0'),materials:lineReq.map(r=>({mid:r.m.id,name:r.m.name,qty:r.need,unit:r.m.unit,batch:r.m.batch})),created:TODAY};attachWorkSteps(w);state.workorders.unshift(w);created.push(w.id)});o.status='生产中';log('下达生产并预留物料',created.join('、'));closeModal();location.hash='production';render();toast(created.length>1?('已下达 '+created.length+' 张任务'): (isKit(lines[0].pid)?'装配任务已下达':'生产任务已生成，物料已预留'))},

'start-work':startWork,'confirm-start':id=>{const w=state.workorders.find(x=>x.id===id);if(!w||w.status!=='待开工')return toast('任务状态已变化');const stopped=downAssets();if(stopped.length)return fail('有设备停机，先到设备模块恢复：'+stopped.map(a=>a.code).join('、'));if(['clean','device','staff','material'].some(k=>!document.getElementById('start_'+k)?.checked))return fail('请先完成全部开工确认');for(const l of (w.materials||[])){const m=state.materials.find(x=>x.id===l.mid);if(!m||m.stock+1e-6<l.qty||!m.approved)return fail('物料状态或库存已变化，请重新核对')}for(const l of (w.materials||[])){const m=state.materials.find(x=>x.id===l.mid);m.stock=Math.round((m.stock-l.qty)*1000)/1000;m.reserved=Math.max(0,Math.round(((m.reserved||0)-l.qty)*1000)/1000)}w.status='生产中';w.started=TODAY;enqueue('生产领料',w.id);log('完成开工校验并领料',id);closeModal();tabs.production='process';render();toast('已开工，请按工艺卡记录工序后再报工')},
'report-work':reportWork,'confirm-report':id=>{const w=state.workorders.find(x=>x.id===id);if(!w||w.status!=='生产中')return toast('工单已报工，未重复提交');if(w.hold)return toast('停工中，请先恢复');if((w.steps||[]).some(s=>!s.done))return fail('请先记完全部工序');const good=+val('wGood'),reject=+val('wReject'),hours=+val('wHours'),date=val('wDate');if(!Number.isInteger(good)||!Number.isInteger(reject)||good<1||reject<0||good+reject!==w.qty)return fail('合格待检须大于0，且与不良之和等于计划 '+w.qty+' 箱');if(!(hours>0)||!date||date<TODAY)return fail('请填写有效工时与完工日期');if(!document.getElementById('wProcess')?.checked)return fail('请完成批记录确认');w.good=good;w.reject=reject;w.hours=hours;w.note=val('wNote');w.status='已完工';w.batch='FG-'+date.replaceAll('-','').slice(2)+'-'+w.pid+'-'+w.id.split('-').at(-1);const raw=(w.materials||[]).map(l=>l.batch).filter(Boolean).join(' / ')||'标准投料';state.batches.unshift({id:w.batch,pid:w.pid,qty:good,initial:good,date,exp:addDays(date,product(w.pid).life||180),status:'待检',raw,source:w.id,work:w.id,loc:'成品待检区'});if(reject>0){const ng=w.batch+'-NG';state.batches.unshift({id:ng,pid:w.pid,qty:reject,initial:reject,date,exp:addDays(date,product(w.pid).life||180),status:'隔离',raw,source:w.id+' 不良',work:w.id,loc:'隔离管控区'});state.capas.unshift({id:nextCode(state.capas,'CA-'),batch:ng,title:'生产不良隔离',status:'待整改',owner:state.role,date:TODAY,note:w.note||''})}const o=state.orders.find(x=>x.id===w.order);if(o){const sib=state.workorders.filter(x=>x.order===o.id);o.status=sib.every(x=>x.status==='已完工')?'待检验':'生产中'}enqueue('生产入库（待检）',w.batch);log('完工产出进入待检区',w.batch);closeModal();location.hash='quality';render();toast('已生成待检批次；未经质量放行不可发货')},
'work-detail':id=>{const w=state.workorders.find(x=>x.id===id);if(!w)return;attachWorkSteps(w);const bat=w.batch?(state.batches||[]).find(b=>b.id===w.batch):null;modal('生产单 · '+id,`${kv([['来源',w.order&&w.order!=='备货'?action(w.order,'order-detail',w.order):(w.order||'备货')],['产品',product(w.pid).name],['计划 / 状态',w.qty+' 箱 / '+(w.hold?'停工':w.status)],['配方版本',w.version||'—'],['产出批次',w.batch?action(w.batch,'batch-detail',w.batch)+'<small>'+(bat?bat.status:'')+'</small>':'尚未完工'],['工时',w.hours?num(w.hours)+' 小时':'尚未报工']])}<h3 class="mt">物料与批次</h3>${(w.materials||[]).length?table(['物料','批次','领用量'],w.materials.map(l=>[l.name,lotLink(l.batch),num(l.qty)+' '+l.unit])):notice('礼盒 / 备货装配，无自制投料。')}<h3 class="mt">工序</h3>${table(['工序','控制点','记录'],(w.steps||[]).map(s=>[s.name,s.ctrl,s.done?tag('已记录','green'):tag('未记录','gold')]))}`,btn('关闭','close')+(w.status==='待开工'?btn('开工确认','start-work',id,'primary'):w.status==='生产中'?(w.hold?btn('恢复','resume-work',id,'primary'):btn('记录完工','report-work',id,'primary')):(bat&&bat.status==='待检'?btn('检验放行','inspect',w.batch,'primary'):(w.batch?btn('查看产出','batch-detail',w.batch,'primary'):''))),true)},
inspect:inspectBatch,'confirm-inspect':id=>{const b=state.batches.find(x=>x.id===id);if(!b||b.status!=='待检')return toast('本批次已经处置');if(!val('qReport').trim())return fail('请填写检验报告编号');const pass=val('qResult')==='pass';if(pass&&['qRecord','qTests','qAuthority'].some(k=>!document.getElementById(k)?.checked))return fail('放行前必须完成全部质量复核');if(!pass&&!val('qNote').trim())return fail('隔离时请填写异常原因');b.status=pass?'合格':'隔离';b.report=val('qReport').trim();b.qualityNote=val('qNote').trim();b.loc=pass?'成品合格区':'隔离管控区';if(!pass)state.capas.unshift({id:nextCode(state.capas,'CA-'),batch:id,title:'成品检验不合格',status:'待整改',owner:state.role,date:TODAY,note:val('qNote')});const w=state.workorders.find(x=>x.id===b.work||x.batch===b.id||x.id===b.source);if(w){const o=state.orders.find(x=>x.id===w.order);if(o&&!String(b.id).endsWith('-NG')){const sib=state.workorders.filter(x=>x.order===o.id);const ready=sib.every(wo=>{const bat=state.batches.find(x=>x.id===wo.batch);return bat&&bat.status==='合格'});o.status=pass&&ready?'待发货':'待检验'}}enqueue(pass?'质量放行':'质量隔离',id);log(pass?'质量授权放行':'质量隔离',id);closeModal();render();toast(pass?'批次已放行；发货时仍需校验效期':'批次已隔离并开 CAPA，禁止发货')},
'batch-detail':id=>{const b=state.batches.find(x=>x.id===id);if(!b)return toast('未找到批次');const ships=state.shipments.filter(s=>s.lines.some(l=>l.batch===id));const wo=workOfBatch(b);modal('批次数字档案 · '+id,`${kv([['产品 / 规格',product(b.pid).name+' / '+product(b.pid).spec],['生产 / 到期',b.date+' / '+b.exp],['质量状态',tag(b.status)],['库位',b.loc||defaultLoc(b)],['初始 / 在库 / 已售',(b.initial||b.qty)+' / '+b.qty+' / '+soldQty(id)],['生产单',wo?action(wo.id,'work-detail',wo.id):esc(b.source||'—')],['投料批',lotLink(b.raw,id)],['报告',esc(b.report||'—')],['说明',esc(b.qualityNote||'—')]])}<h3 class="mt">销售去向</h3>${table(['发货单','客户','数量','状态'],ships.length?ships.map(s=>[action(s.id,'ship-detail',s.id),esc(s.customer),s.lines.filter(l=>l.batch===id).reduce((a,l)=>a+l.qty,0)+' 箱',tag(s.status)]):[['—','尚未发货','—','—']]) }`,btn('关闭','close')+btn('追溯链','show-trace',id)+(b.status==='待检'?btn('进入检验','inspect',id,'primary'):b.status==='合格'?btn('冻结','freeze-batch',id,'danger'):btn('启动召回','recall-open',id,'danger')),true)},
 allocate:showAllocation,'confirm-ship':id=>{const o=state.orders.find(o=>o.id===id);if(!o||o.status!=='待发货')return toast('该订单已处理');const a=allocation(o);if(a.left)return fail('库存已变化，可发量不足，无法发货');a.lines.forEach(l=>{l.b.qty-=l.qty;moveLog(l.b.id,'销售出库',l.qty,o.id)});const sid='SH-260917-'+String(state.shipments.length+1).padStart(3,'0');state.shipments.unshift({id:sid,order:id,customer:o.customer,pid:orderLines(o)[0].pid,qty:orderQty(o),price:orderAmt(o)/Math.max(1,orderQty(o)),amount:orderAmt(o),lines:a.lines.map(l=>({batch:l.b.id,qty:l.qty,pid:l.pid})),status:'运输中',date:TODAY});o.status='已发货';enqueue('销售出库',sid);log('按效期规则分配并发货',sid);closeModal();location.hash='delivery';render();toast('发货完成，已加入用友同步队列')},
 'trace-batch':id=>{if(id==='FG-260910-H01'){closeModal();location.hash='trace'}else ACTIONS['batch-detail'](id)},
 'trace-query':()=>ACTIONS.scan(),scan:()=>modal('输入批次或工单编号',`${field('批次号 / 工单号','scanCode','text','FG-260910-H01')}<div class="notice mt">支持成品批次和已创建的生产工单编号，可对接扫码枪或 PDA。</div>`,btn('取消','close')+btn('查询','do-scan','','primary')),
 'do-scan':()=>{const id=val('scanCode').trim();if(state.batches.some(b=>b.id===id))return showTraceTree(id);if(state.workorders.some(w=>w.id===id))return ACTIONS['work-detail'](id);if(state.purchaseRequests.some(r=>r.id===id||r.batch===id)){const r=state.purchaseRequests.find(x=>x.id===id||x.batch===id);return ACTIONS['purchase-detail'](r.id)}fail('未找到编号。可试 FG-260910-H01 或已下达工单号')},
 'new-purchase':()=>{const admitted=admittedSuppliers();if(!admitted.length)return toast('没有已准入供应商，请先在供应商页完成准入');modal('采购申请',`<div class="form-grid">${field('供应商 <span class="required">*</span>','prSup','select','',admitted.map(s=>`<option value="${s.id}">${s.name}</option>`).join(''))}${field('采购物料','prMaterial','select','',state.materials.map(m=>`<option value="${m.id}">${m.name}（${m.unit}）</option>`).join(''))}${field('申请数量','prQty','number',500,'min="0.001" step="0.001"')}${field('采购用途','prNote','textarea','补充生产备料',null,true)}</div>${notice('未准入或已停用的供应商不会出现在此列表。')}`,btn('取消','close')+btn('保存申请','save-purchase','','primary'))},
 'save-purchase':()=>{const m=state.materials.find(x=>x.id===val('prMaterial')),q=+val('prQty'),sup=val('prSup');if(!admittedSuppliers().some(s=>s.id===sup))return fail('请选择已准入供应商');if(!m||!(q>0&&q<1000000))return fail('请填写有效申请数量');if(m.unit==='个'&&!Number.isInteger(q))return fail('包装数量须为整数');const id='PR-'+String(state.purchaseRequests.length+1).padStart(4,'0');state.purchaseRequests.push({id,mid:m.id,name:m.name,qty:q,unit:m.unit,supplier:sup,status:'待采购',note:val('prNote')});log('创建采购申请',id);closeModal();tabs.purchase='requests';render();toast('采购申请已保存')},
 'receive-purchase':id=>{const r=state.purchaseRequests.find(x=>x.id===id);if(!r||r.status!=='待采购')return;modal('登记采购到货',`${kv([['申请',r.id],['物料',r.name],['申请数量',num(r.qty)+' '+r.unit],['供应商',supplierOf(r.supplier).name]])}<div class="form-grid mt">${field('供应商批号','prLot','text','LOT-'+id)}${field('实收数量','prInQty','number',r.qty,'min="0.001" step="0.001"')}${field('生产日期','prDate','date',TODAY)}${field('到期日','prExp','date',addDays(TODAY,180))}</div>${notice('到货先待检，不加可用量。')}`,btn('取消','close')+btn('确认到货，进入待检','confirm-receive',id,'primary'))},
 'confirm-receive':id=>{const r=state.purchaseRequests.find(x=>x.id===id);if(!r||r.status!=='待采购')return;const q=+val('prInQty');if(!(q>0))return fail('请填写实收数量');r.status='到货待检';r.batch=val('prLot').trim()||('RCV-'+id);r.inQty=q;r.inDate=val('prDate')||TODAY;r.inExp=val('prExp')||'';log('采购到货待检',id);closeModal();render();toast('到货已登记，检验前不会增加物料可用量')},
 'release-purchase':id=>{const r=state.purchaseRequests.find(x=>x.id===id);if(!r||r.status!=='到货待检')return;modal('到货检验 · '+r.name,`${kv([['实收',num(r.inQty||r.qty)+' '+r.unit],['供应商批号',r.batch||'—']])}<div class="form-grid mt">${field('检验结论','prResult','select','','<option value="pass">合格入库</option><option value="fail">不合格拒收</option>')}${field('检验记录编号','prReport','text','IQC-'+TODAY.replaceAll('-','').slice(2)+'-'+id.slice(-3))}${field('说明','prIqcNote','textarea','',null,true)}</div><div class="checklist"><label><input type="checkbox" id="prQual"> 随货资料、外观与适用项目已核对</label></div>`,btn('取消','close')+btn('提交检验结论','confirm-release-purchase',id,'primary'))},
 'confirm-release-purchase':id=>{const r=state.purchaseRequests.find(x=>x.id===id);if(!r||r.status!=='到货待检')return;if(!document.getElementById('prQual')?.checked||!val('prReport').trim())return fail('请勾选核对并填写检验编号');const pass=val('prResult')!=='fail';r.report=val('prReport');r.note=(r.note?r.note+' ':'')+(val('prIqcNote')||'');if(!pass){r.status='已拒收';state.capas.unshift({id:nextCode(state.capas,'CA-'),batch:r.batch,title:'来料不合格 · '+r.name,status:'待整改',owner:state.role,date:TODAY,note:val('prIqcNote')||'来料拒收'});log('采购拒收',id);closeModal();render();toast('已拒收，未增加可用量，并开 CAPA');return}r.status='已入库';const m=state.materials.find(x=>x.id===r.mid);const add=r.inQty||r.qty;m.stock=Math.round((m.stock+add)*1000)/1000;m.batch=r.batch;m.approved=true;enqueue('采购入库',r.id);log('采购检验合格入库',id);closeModal();render();toast('可用物料已增加，可回计划重新测算')},
 'purchase-detail':id=>{const r=state.purchaseRequests.find(x=>x.id===id);if(!r)return;modal('采购记录 · '+id,kv([['物料',r.name],['数量',num(r.qty)+' '+r.unit],['实收',r.inQty!=null?num(r.inQty):'—'],['供应商',supplierOf(r.supplier).name],['来源',r.order||'人工 / 补货'],['状态',r.status],['收货批次',r.batch||'未到货'],['生产 / 到期',(r.inDate||'—')+' / '+(r.inExp||'—')],['检验编号',r.report||'未检验'],['说明',esc(r.note||'—')]]),btn('关闭','close')+(r.status==='待采购'?btn('登记到货','receive-purchase',id,'primary'):r.status==='到货待检'?btn('到货检验','release-purchase',id,'primary'):''),true)},
 'recall-open':id=>{const bid=id||'FG-260910-H01';const exist=recallOpenOf(bid);if(exist)return ACTIONS['recall-report'](exist.id);const b=state.batches.find(x=>x.id===bid);if(!b)return toast('未找到批次');const sold=soldQty(bid);modal('启动召回 · '+bid,`${notice('确认后冻结该批次，禁止再发货。','warn')}${kv([['产品',product(b.pid).name],['当前状态',b.status],['在库',b.qty+' 箱'],['已发',sold+' 箱'],['投料批',esc(b.raw||'—')]])}${field('召回原因','rReason','textarea','标识偏差，需冻结并回收核查。')}`,btn('取消','close')+btn('确认冻结并发起','confirm-recall',bid,'danger'))},

 'new-sample':id=>{
    if(!sampleLeads().length)return toast('请先领取或新建在跟商机，再寄样');
    if(!goodBatches().length)return toast('没有合格成品库存，不能寄样');

  },
  'save-sample':()=>{
    const lead=state.leads.find(x=>x.id===val('spLead'));
    if(!lead||lead.pool||lead.stage==='公海')return fail('请选择在跟商机');
    const b=state.batches.find(x=>x.id===val('spBatch'));
    const qty=+val('spQty'),way=val('spWaybill').trim();
    if(!b||b.status!=='合格'||!(b.qty>0))return fail('请选择有库存的合格批次');
    if(!Number.isInteger(qty)||qty<1||qty>b.qty)return fail('数量须为 1 至该批次在库箱数的整数');
    if(!way)return fail('请填写运单号');
    b.qty-=qty;
    moveLog(b.id,'寄样出库',qty,lead.customer+' / '+lead.id);
    const sid=nextCode(state.samples||[],'SP-',4);
    state.samples=state.samples||[];
    state.samples.unshift({id:sid,lead:lead.id,cid:lead.cid||'',customer:lead.customer,pid:b.pid,qty,batch:b.id,waybill:way,status:'运输中',date:TODAY,owner:lead.owner||state.role||'销售一组',note:val('spNote').trim()});
    addLeadNote(lead,TODAY+' · 寄出样品 '+sid+'：'+product(b.pid).name+' '+qty+' 箱，批次 '+b.id+'，运单 '+way);
    lead.next='跟踪样品签收与口味反馈';
    if(lead.stage==='需求确认')lead.stage='样品评估';
    log('寄样出库',sid);
    closeModal();tabs.crm='pool';render();toast(sid+' 已出库，状态为运输中');
  },

    s.status='待反馈';
    const l=state.leads.find(x=>x.id===s.lead);
    if(l){addLeadNote(l,TODAY+' · '+s.id+' 已到货，待登记口味反馈');l.next='登记样品口味反馈'}
    log('寄样到货',id);save();tabs.crm='pool';render();toast('已到货，请登记客户反馈');

'fill-formula':id=>{const f=formulaOf(id);if(!f||(f.status!=='试制'&&f.status!=='评审中'))return toast('仅试制或评审中的配方可改物料');const p=allProducts().find(x=>x.id===f.pid),src=formulaSource(refPidFor(p));if(!src)return toast('没有可复制的参考配方');f.lines=structuredClone(src.lines);f.kit=!!src.kit;f.note=(f.note?f.note+' ':'')+'已按 '+product(src.pid).name+' 带入物料。';log('补齐配方物料',id);save();formulaDetail(id);toast('已带入参考产品物料')},
'save-formula-lines':id=>{const f=formulaOf(id);if(!f||(f.status!=='试制'&&f.status!=='评审中'))return toast('当前版本不可改物料');const lines=[];for(let i=0;i<5;i++){const mid=val('fM'+i),qty=+val('fQ'+i),raw=val('fR'+i).trim(),role=raw.split('/')[0].trim()||'物料',loss=parseFloat((raw.split('/')[1]||'').replace('%',''));if(!mid)continue;if(!(qty>0))return fail('已选物料的用量须大于 0');lines.push({mid,qty,role,loss:Number.isFinite(loss)?loss:0})}if(!f.kit&&!lines.length)return fail('至少保留一行物料');f.lines=lines;log('维护配方物料',id);save();formulaDetail(id);toast('物料清单已保存')},
'fill-process':id=>{const src=val('prSrc')||refPidFor(allProducts().find(x=>x.id===id));copyProcess(id,src);log('复制工艺卡',id);save();editProcess(id);toast('已用参考产品工序覆盖，可再改')},

 'cost-detail':id=>{const c=skuCost(id);modal('标准成本单 · '+c.p.name,`${kv([['规格',c.p.spec],['配方',c.f?c.f.id+' · '+c.f.version+' · '+c.f.status:'尚未建档'],['材料',money(c.mat)+' / 箱'],['直接人工',money(c.labor)+' / 箱'],['制造费用',money(c.oh)+' / 箱'],['标准成本',money(c.total)+' / 箱'],['标准价',money(c.price)+' / 箱'],['毛利空间',((c.margin/c.price)*100).toFixed(1)+'%']])}<h3 class="mt">材料明细</h3>${c.f?formulaTable(c.f):notice('没有配方')}`,btn('关闭','close')+(c.f?btn('打开配方','formula-detail',c.f.id,'primary'):''),true)},
 'go-maps':()=>{tabs.integration='mapping';if(location.hash!=='#integration')location.hash='integration';else render()},
 'map-detail':id=>{const m=mapOf(id);if(!m)return;modal('映射单 · '+m.id,kv([['对象',m.obj],['本平台',m.local],['用友编码',m.erp||'未填'],['状态',m.status],['维护人',esc(m.owner)],['说明',esc(m.note||'—')]]),btn('关闭','close')+(m.status!=='已映射'?btn('去补映射','mapping','','primary'):''))},
 'env-detail':id=>{const e=envOf(id);if(!e)return;modal('对接环境 · '+e.id,kv([['事项',esc(e.title)],['负责人',esc(e.owner)],['日期',e.date],['状态',e.status],['说明',esc(e.note||'—')]]),btn('关闭','close')+(e.status!=='已确认'?btn('标记已确认','confirm-env',id,'primary'):''))},
 'confirm-env':id=>{const e=envOf(id);if(!e)return;e.status='已确认';log('确认对接环境',id);save();closeModal();tabs.integration='architecture';render();toast('环境单已确认')},
 'return-detail':id=>{const r=returnOf(id);if(!r)return;modal('退换货 · '+r.id,kv([['客户',esc(r.customer)],['原订单',r.order],['批次',r.batch],['数量',r.qty+' 箱'],['原因',esc(r.reason)],['状态',r.status],['日期',r.date],['负责人',esc(r.owner||'—')]]),btn('关闭','close')+(r.status==='待质量评估'?btn('评估通过，转审批','assess-return',id,'primary')+btn('拒收退回','reject-return',id,'danger'):r.status==='待审批'?btn('批准换货','approve-return',id,'primary'):''))},
 'assess-return':id=>{const r=returnOf(id);if(!r||r.status!=='待质量评估')return;r.status='待审批';log('退货质量评估',id);save();closeModal();tabs.delivery='service';render();toast('已转销售审批，不回可售库存')},
 'reject-return':id=>{const r=returnOf(id);if(!r)return;r.status='已拒收';log('退货拒收',id);save();closeModal();render();toast('已拒收，原发货不回库')},
 'approve-return':id=>{const r=returnOf(id);if(!r||r.status!=='待审批')return;r.status='已换货';log('批准换货',id);save();closeModal();render();toast('已记换货，不自动增加可售库存')}

const INFO={
 'planning-rules':['计划与排程规则', [['需求分层','订单需求与备库预测分开；预测转订单后避免重复计算'],['净需求','原料可用量 = 合格实存 − 预留；考虑安全库存、采购批量与交期'],['排产口径','按单全量生产，不抵扣历史成品；物料先预留，开工再消耗'],['排程约束','产能、换线、清洁、过敏原、人员资质、设备日历与检验周期'],['变更处理','插单、取消和返工必须评估已领物料、在制品与客户交期']]],
 'warehouse-rules':['仓储规则与盘点', [['库区','原料、包材、成品分别管理；待检、合格、隔离状态与库位关联'],['出库顺序','先做质量和客户效期资格筛选，再按最早到期排序'],['盘点','生成盘点任务，冻结或控制期间业务，初盘复盘后审批差异'],['数量单位','袋、箱、kg 按产品换算关系转换，不同规格不允许直接混合相加'],['临期规则','按 SKU 与渠道设定预警；不因先到期原则突破客户收货底线']]],
 'supplier-rules':['供应商准入资料清单', [['基础信息','企业主体、联系人、统一主编码与采购类别'],['资质资料','适用生产/经营许可、产品与食品接触材料证明、授权等'],['质量审查','准入审核、样品检测、审厂与食品安全承诺；按风险分级'],['证照到期','提醒负责人续期；失效后限制新增业务并评估库存风险'],['绩效评价','质量合格、交期、价格、服务与整改表现，形成停用或复评依据']]]
};
for(const [key,[h,items]] of Object.entries(INFO))ACTIONS[key]=()=>modal(h,kv(items));
function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function csv(rows){return '\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(',')).join('\r\n')}
ACTIONS.export=type=>{let rows,name;if(type==='orders'){rows=[['订单号','客户','产品','数量','单位','单价','金额','交期','状态'],...state.orders.flatMap(o=>orderLines(o).map(l=>[o.id,o.customer,product(l.pid).name,l.qty,product(l.pid).unit||'箱',l.price,l.price*l.qty,o.due,o.status]))];name='凤凰人家_销售订单.csv'}else if(type==='products'){rows=[['产品编码','内部编码','名称','规格','类型','状态','标准价','保质期','生效配方','过敏原'],...allProducts().map(p=>{const f=activeFormula(p.id);return[p.id,p.code||'',p.name,p.spec,p.type||'',p.status,p.price,p.life||'',f?f.version:'',p.allergen||'']})];name='凤凰人家_产品档案.csv'}else{rows=[['批次','产品','生产日期','到期日期','数量','单位','质量状态'],...state.batches.map(b=>[b.id,product(b.pid).name,b.date,b.exp,b.qty,'箱',b.status])];name='凤凰人家_批次库存.csv'}download(name,csv(rows),'text/csv;charset=utf-8');toast('已导出当前列表')};
ACTIONS['export-state']=()=>{download('凤凰人家_账套数据.json',JSON.stringify({version:'1.4',demoDate:TODAY,exportedAt:new Date().toISOString(),data:state},null,2),'application/json');toast('账套数据已导出为 JSON 文件')};
ACTIONS['reset-dialog']=()=>modal('重置本机账套',notice('此操作重置当前浏览器中的订单、生产、审批与召回记录。可先导出账套。','warn'),btn('取消','close')+btn('导出账套数据','export-state')+btn('确认重置','confirm-reset','','danger'));
ACTIONS['confirm-reset']=()=>{state=seed();save();closeModal();tabs={};location.hash='dashboard';page='dashboard';render();toast('账套已恢复初始状态')};
ACTIONS['print-plan']=()=>{document.getElementById('printArea').innerHTML=`<h1>河北凤凰人家食品有限公司<br>数字化建设方案</h1><p>建设方案 V1.0 · 2026-09-17</p><p>适用范围：工厂运营、产供销、食品质量、组织人力及用友协同。</p><h2>一、企业概况</h2>${researchContent()}<h2>二、总体目标与模块范围</h2>${scopeContent()}<h2>三、实施路线与项目责任</h2>${roadmapContent()}<h2>四、业务验收与价值指标</h2>${acceptanceContent()}<h2>五、核心数据与系统边界</h2>${modelContent()}<h2>六、实施确认清单</h2>${table(['主题','问题','资料','负责人'],QUESTIONS,'matrix')}<p>实施阶段接入真实接口、身份授权、事务库存与设备采集。</p>`;document.querySelectorAll('#printArea details').forEach(d=>d.open=true);window.print()};
function searchResults(q=''){q=q.trim().toLowerCase();let modules=NAV.flatMap(g=>g[1]).filter(([id,t])=>(id+t).toLowerCase().includes(q)).map(([id,t])=>({t,sub:'功能模块',a:'go',id}));let orders=state.orders.filter(o=>(o.id+o.customer+orderName(o)).toLowerCase().includes(q)).map(o=>({t:o.id,sub:o.customer+' / '+orderName(o),a:'order-detail',id:o.id}));let batches=state.batches.filter(b=>(b.id+product(b.pid).name).toLowerCase().includes(q)).map(b=>({t:b.id,sub:product(b.pid).name+' / '+b.status,a:'batch-detail',id:b.id}));let skus=allProducts().filter(p=>(p.id+p.name).toLowerCase().includes(q)).map(p=>({t:p.id,sub:p.name+' / 产品档案',a:'product-detail',id:p.id}));let list=(q?[...modules,...skus,...orders,...batches]:modules).slice(0,16);document.getElementById('searchResults').innerHTML=list.length?list.map(x=>`<button class="search-result" data-action="${x.a}" data-id="${x.id}"><span>${esc(x.t)}</span><small>${esc(x.sub)}</small></button>`).join(''):empty('没有找到结果','试试“订单”“批次”或 FG-260910-H01')}
ACTIONS.search=()=>{modal('全局搜索',`<input id="globalSearch" type="search" placeholder="输入模块名、订单号、客户或成品批次" style="width:100%" aria-label="全局搜索"><div id="searchResults" class="search-results"></div>`,btn('关闭','close'));searchResults();document.getElementById('globalSearch').addEventListener('input',e=>searchResults(e.target.value))};
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const fn=ACTIONS[el.dataset.action];if(fn){try{fn(el.dataset.id,el)}catch(err){console.error(err);toast('操作未完成，请检查当前记录状态。')}}});
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();ACTIONS.search()}if(e.key==='Tab'&&!document.getElementById('overlay').classList.contains('hidden')){let a=[...document.querySelectorAll('#dialog button,#dialog input,#dialog select,#dialog textarea,#dialog a')].filter(x=>!x.disabled&&x.offsetParent);if(!a.length)return;let first=a[0],last=a.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.getElementById('roleSelect').addEventListener('change',e=>{state.role=e.target.value;save();const target={'经营负责人':'dashboard','销售经理':'crm','生产主管':'production','质量负责人':'quality','仓库主管':'warehouse','人力行政':'hr','财务人员':'finance'}[state.role];location.hash=target;toast('已切换为'+state.role+'视角')});
window.addEventListener('hashchange',navigate);navigate();
